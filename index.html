<!doctype html>

<title>LO: the first message</title>
<meta name="description" content="29 October 1969, 22:30. UCLA tried to log in to SRI over the ARPANET. L, O, then the SRI computer crashed. A short film in type, light and sound.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Caveat:wght@600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050607; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: ew-resize; }
  .ui { position: fixed; font: 700 12px/1 "Space Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase;
        color: #efe6d4; user-select: none; -webkit-user-select: none; }
  #snd { top: max(16px, env(safe-area-inset-top)); right: 16px; min-height: 44px; padding: 0 16px; background: none; border: 1.5px solid currentColor; cursor: pointer; opacity: .85; }
  #hint { left: 16px; bottom: 22px; opacity: .6; pointer-events: none; }
  #bar { left: 0; bottom: 0; width: 100%; height: 3px; background: #efe6d4; opacity: .6; transform-origin: 0 0; transform: scaleX(0); pointer-events: none; }
  .clean .ui, .play .ui { display: none; }
</style>
</head>
<body>
<canvas id="gl" role="img" aria-label="Short film. 29 October 1969, 22:30. Charley Kline at UCLA and Bill Duvall at SRI, 350 miles apart, on the phone. Charley types L: did you get the L? Got the L. O: got the O. G: the SRI computer crashes. So the first message on the internet was LO, as in lo and behold. An hour later LOGIN worked. The only record is one line in the UCLA log: 22:30, talked to SRI host to host."></canvas>
<button id="snd" class="ui" type="button" aria-pressed="false">sound: off</button>
<div id="hint" class="ui">drag to scrub · space to replay</div>
<div id="bar" class="ui"></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search);
const CLEAN = Q.has('clean'), PLAY = Q.has('play'), FREEZE = Q.has('t') ? +Q.get('t') : null;
if (CLEAN) document.body.classList.add('clean'); if (PLAY) document.body.classList.add('play');

const TL = await (await fetch('timeline.json')).json();
const T = { dur: 61, globe: 52.4, strike: [17.30, 21.83, 25.98], crash: 28.0, black: 28.55, after: 30.0, cutLO: 32.9, beam: 33.6, lo: 36.08,
  retry: [40.2, 40.45, 40.7], fill: 41.3, sriBack: 39.9, worked: 42.11, cutLog: 43.3, pen: 47.4, penEnd: 51.0, net: 51.0 };
// each pulse leaves UCLA at t0 and reaches SRI at t1
const PULSES = [[17.35, 18.15], [21.88, 22.55], [26.05, 27.95], ...T.retry.map((r) => [r + 0.03, r + 0.5])];

// ---------- helpers ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = (a, b, x) => { const k = cl((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const lerp = (a, b, k) => a + (b - a) * k;
const EASE = { io: (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, in: (k) => k * k * k, out: (k) => 1 - Math.pow(1 - k, 3), lin: (k) => k };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const INK = '#1b1814', PAPER = '#ebe3d1', RED = '#d8402a', CREAM = '#efe6d4';
const F = (px, w = 700) => `${w} ${px}px "Space Mono", ui-monospace, monospace`;
const HAND = (px) => `600 ${px}px Caveat, cursive`;
const pulseU = (i, t) => { const [a, b] = PULSES[i]; return t < a || t > b + 0.12 ? -1 : (i === 2 ? EASE.in(cl((t - a) / (b - a))) * .55 + cl((t - a) / (b - a)) * .45 : EASE.io(cl((t - a) / (b - a)))); };
const flash = (times, t, k = 14) => times.reduce((m, s) => t >= s ? Math.max(m, Math.exp(-(t - s) * k)) : m, 0);

try { await Promise.all([document.fonts.load(F(100)), document.fonts.load(F(100, 400)), document.fonts.load(HAND(100))]); } catch (e) { /* system fonts */ }
const font = await new FontLoader().loadAsync('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/fonts/droid/droid_sans_mono_regular.typeface.json');

// ---------- renderer, scene, camera ----------
const cv = document.getElementById('gl');
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.0;
const scene = new THREE.Scene(), FOG = new THREE.FogExp2(0x050607, 0.011); scene.background = new THREE.Color(0x050607); scene.fog = FOG;
const cam = new THREE.PerspectiveCamera(32, 0.8, 0.1, 400); cam.up.set(0, 0, 1);

function canvasTex(c, srgb = true) { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// table: dark walnut
{ const c = mk(1024, 1024), g = c.getContext('2d'), r = rng(3);
  g.fillStyle = '#2a1f17'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 900; i++) { const y = r() * 1024, a = r() * .09; g.strokeStyle = r() < .5 ? `rgba(0,0,0,${a})` : `rgba(120,80,50,${a * .7})`; g.lineWidth = 1 + r() * 4;
    g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= 1024; x += 64) g.lineTo(x, y + Math.sin(x * .01 + i) * 3 + (r() - .5) * 2); g.stroke(); }
  const tex = canvasTex(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(10, 10);
  const table = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), new THREE.MeshStandardMaterial({ map: tex, roughness: .78, metalness: 0 }));
  table.receiveShadow = true; scene.add(table); }

// soft contact shadow under each sheet
const shadowTex = (() => { const c = mk(256, 256), g = c.getContext('2d'); g.filter = 'blur(18px)'; g.fillStyle = '#000'; g.fillRect(40, 40, 176, 176); return canvasTex(c, false); })();
function paperBase(w, h, seed) {
  const c = mk(w, h), g = c.getContext('2d'), r = rng(seed);
  g.fillStyle = PAPER; g.fillRect(0, 0, w, h);
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 12; d[i] += n; d[i + 1] += n; d[i + 2] += n * .9; }
  g.putImageData(id, 0, 0);
  g.globalAlpha = .07; g.strokeStyle = '#7d6c52'; g.lineWidth = 1.2;
  for (let i = 0; i < w * h / 7000; i++) { const x = r() * w, y = r() * h, a = r() * 6.28, l = 8 + r() * 26;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + r() * 5, y + Math.sin(a) * l * .5 + r() * 5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  g.globalAlpha = 1; const gr = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .25, w / 2, h / 2, Math.max(w, h) * .72);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(70,45,15,.2)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  return c;
}
function sheet(w, h, ppu, x, y, rot, seed) {
  const c = mk(w * ppu, h * ppu), tex = canvasTex(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness: .93 }));
  m.position.set(x, y, 0.012); m.rotation.z = rot; m.receiveShadow = true; scene.add(m);
  const s = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.45, h * 1.45), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, opacity: .85, depthWrite: false }));
  s.position.set(x + .12, y - .14, 0.004); s.rotation.z = rot; scene.add(s);
  return { c, g: c.getContext('2d'), tex, m, w, h, ppu, base: paperBase(w * ppu, h * ppu, seed), key: '' };
}
// world point of a texture pixel on a sheet
function onSheet(S, px, py, z = 0.02) { const v = new THREE.Vector3(px / S.ppu - S.w / 2, S.h / 2 - py / S.ppu, 0).applyAxisAngle(new THREE.Vector3(0, 0, 1), S.m.rotation.z); return v.add(S.m.position).setZ(z); }

const U = sheet(8, 6, 200, 0, -5.2, 0.015, 11);     // UCLA terminal printout
const S = sheet(8, 5, 200, 0, 6.65, -0.02, 12);     // SRI printout
const LOG = sheet(7, 9, 200, 12.2, -3.4, -0.035, 13); // the IMP log page

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x2c3038, 0x090706, .35));
const moon = new THREE.DirectionalLight(0x8ea6cc, .1); moon.position.set(-20, 10, 30); scene.add(moon);
function spot(color, pos, tgt, angle, pen, shadow = true) {
  const s = new THREE.SpotLight(color, 0, 0, angle, pen, 0); s.position.set(...pos); s.target.position.set(...tgt); scene.add(s, s.target);
  if (shadow) { s.castShadow = true; s.shadow.mapSize.set(2048, 2048); s.shadow.bias = -0.0004; s.shadow.camera.near = 2; s.shadow.camera.far = 60; }
  return s;
}
const lampU = spot(0xffc48a, [-3, -11.5, 10], [0, -5.0, 0], .46, .95);
const lampS = spot(0xffc48a, [3, 12.5, 10], [0, 6.6, 0], .44, .95);
const beam = spot(0xfff0da, [-8.6, 3.2, 12], [-8.6, 5.9, 0], .24, .5);
const logLamp = spot(0xffcf9a, [16.5, -0.5, 10], [12.4, -2.8, 0], .42, .95);
const flashL = new THREE.PointLight(0xffb066, 0, 4, 2); scene.add(flashL);

// ---------- wire and phone cord ----------
const WIRE = new THREE.CatmullRomCurve3([[0, -2.2], [.35, -.6], [-.35, 1.0], [.25, 2.6], [0, 4.15]].map(([x, y]) => new THREE.Vector3(x, y, .06)));
const wireGeo = new THREE.TubeGeometry(WIRE, 600, .03, 8);
const wire = new THREE.Mesh(wireGeo, new THREE.MeshStandardMaterial({ color: 0x1a1612, roughness: .5, metalness: .3 })); wire.castShadow = true; scene.add(wire);
const glowMat = new THREE.ShaderMaterial({
  uniforms: { uDraw: { value: 0 }, uP: { value: [-1, -1, -1, -1, -1, -1, -1, -1] }, uBase: { value: 0 }, uBurn: { value: 0 }, uDead: { value: 0 }, uRed: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform float uDraw, uP[8], uBase, uBurn, uDead, uRed; varying vec2 vUv;
    void main(){ float u = vUv.x; if (u > uDraw) discard;
      float a = uBase * (1.0 - uDead);
      for (int i = 0; i < 8; i++) { if (uP[i] < 0.0) continue; float d = u - uP[i];
        a += exp(-pow(d / 0.018, 2.0)) * 6.0 + (d < 0.0 ? exp(d / 0.09) * 1.1 : 0.0); }
      vec3 col = mix(vec3(1.0, .72, .42), vec3(1.0, .18, .08), uRed) * a;
      float b = smoothstep(1.0 - uBurn - .05, 1.0 - uBurn, u) * (1.0 - smoothstep(0.0, 1.0, uDead * 1.4 - (1.0 - u)));
      col += vec3(1.0, .15, .05) * b * 3.0 * step(.001, uBurn);
      gl_FragColor = vec4(col, 1.0); }`,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
const glow = new THREE.Mesh(new THREE.TubeGeometry(WIRE, 600, .045, 8), glowMat); scene.add(glow);
// the wire draws itself; index groups follow the path, so drawRange grows from UCLA to SRI
const setDraw = (geo, k) => geo.setDrawRange(0, Math.floor(geo.index.count * cl(k) / 6) * 6);
// coiled phone cord, parallel to the wire
const CORD = new THREE.Curve(); CORD.getPoint = (s, out = new THREE.Vector3()) => { const y = lerp(-2.2, 4.15, s), a = s * 140 * Math.PI * 2;
  return out.set(2.7 + Math.sin(y * .7) * .12 + Math.cos(a) * .075, y, .1 + Math.sin(a) * .075); };
const cordGeo = new THREE.TubeGeometry(CORD, 5000, .02, 5);
const cord = new THREE.Mesh(cordGeo, new THREE.MeshStandardMaterial({ color: 0x2c2a27, roughness: .55 })); cord.castShadow = true; scene.add(cord);
// labels lying on the table along the wire and cord
function label(text, w, h, x, y, rot, size = 70) {
  const c = mk(1024, 128), g = c.getContext('2d'); g.font = F(size, 400); g.fillStyle = CREAM; g.textBaseline = 'middle'; g.fillText(text, 8, 64);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: canvasTex(c), transparent: true, opacity: 0, depthWrite: false }));
  m.position.set(x, y, .02); m.rotation.z = rot; scene.add(m); return m;
}
const labWire = label('ARPANET · 350 MILES', 6.4, .8, 1.05, .95, Math.PI / 2);
const labCord = label('PHONE', 6.4, .8, 3.35, .95, Math.PI / 2);

// pulses
const pulses = [0, 1, 2].map(() => { const m = new THREE.Mesh(new THREE.SphereGeometry(.085, 16, 12), new THREE.MeshBasicMaterial({ color: new THREE.Color(4, 3, 2) }));
  const l = new THREE.PointLight(0xffb066, 0, 3.5, 2); scene.add(m, l); return { m, l }; });

// ---------- 3D letters ----------
const paperMat = new THREE.MeshStandardMaterial({ color: 0xe9e1cf, roughness: .55, metalness: 0 });
function textGeo(s, size, depth) {
  const g = new TextGeometry(s, { font, size, depth, curveSegments: 12, bevelEnabled: true, bevelThickness: depth * .1, bevelSize: size * .022, bevelSegments: 4 });
  g.computeBoundingBox(); g.center(); g.computeBoundingBox(); return g;
}
const loGeo = textGeo('LO', 2.5, .75); loGeo.rotateX(Math.PI / 2);
const LO = new THREE.Mesh(loGeo, paperMat); LO.castShadow = LO.receiveShadow = true; scene.add(LO);
const LO_H = loGeo.boundingBox.max.y - loGeo.boundingBox.min.y; // after rotateX, text height lies along z
loGeo.computeBoundingBox(); const LO_Z = -loGeo.boundingBox.min.z;
const LO_AT = new THREE.Vector3(-8.6, 5.2, 0);

// shards of the G, sparks, dust
const shardGeo = (() => { const s = new THREE.Shape([new THREE.Vector2(0, 0), new THREE.Vector2(.16, .03), new THREE.Vector2(.06, .14)]);
  const g = new THREE.ExtrudeGeometry(s, { depth: .02, bevelEnabled: false }); g.center(); return g; })();
const NSH = 70, shards = new THREE.InstancedMesh(shardGeo, paperMat, NSH); shards.castShadow = true; scene.add(shards);
const SH = (() => { const r = rng(21); return Array.from({ length: NSH }, () => { const a = r() * Math.PI * 2, sp = 1.2 + r() * 3.4;
  return { a0: a, r0: .25 + r() * .45, v: [Math.cos(a) * sp, Math.sin(a) * sp, 1.5 + r() * 4], w: [(r() - .5) * 20, (r() - .5) * 20, (r() - .5) * 20], s: .6 + r() * 1.1 }; }); })();
const NSP = 160, spGeo = new THREE.BufferGeometry(); spGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(NSP * 3), 3));
const sparks = new THREE.Points(spGeo, new THREE.PointsMaterial({ color: new THREE.Color(3, 1.4, .5), size: .07, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); scene.add(sparks);
const SPK = (() => { const r = rng(5); return Array.from({ length: NSP }, () => { const a = r() * Math.PI * 2, e = r() * 1.2, sp = 2 + r() * 6;
  return { v: [Math.cos(a) * Math.cos(e) * sp, Math.sin(a) * Math.cos(e) * sp, Math.sin(e) * sp + 1], t: r() * .3, life: .35 + r() * .5 }; }); })();
const ND = 260, dGeo = new THREE.BufferGeometry(); dGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ND * 3), 3));
const dustMat = new THREE.PointsMaterial({ color: new THREE.Color(1.4, 1.3, 1.15), size: .035, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
const dust = new THREE.Points(dGeo, dustMat); scene.add(dust);
const DU = (() => { const r = rng(9); return Array.from({ length: ND }, () => [r() * 6.28, r(), r() * 9, r() * 6.28, r()]); })();
// visible light cone of the beam
const coneH = 12, cone = new THREE.Mesh(new THREE.ConeGeometry(coneH * Math.tan(.24), coneH, 48, 1, true), new THREE.ShaderMaterial({
  uniforms: { uA: { value: 0 } }, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: 'varying float vY; varying vec3 vN, vV; void main(){ vY = uv.y; vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position,1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
  fragmentShader: 'uniform float uA; varying float vY; varying vec3 vN, vV; void main(){ float f = pow(abs(dot(vN, vV)), 1.5); gl_FragColor = vec4(vec3(1.0,.93,.82) * uA * f * (0.25 + 0.75 * vY) * 0.16, 1.0); }' }));
{ const top = new THREE.Vector3(-8.6, 3.2, 12), bot = new THREE.Vector3(-8.6, 5.9, 0), mid = top.clone().add(bot).multiplyScalar(.5);
  cone.position.copy(mid); cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), bot.clone().sub(top).normalize()); cone.scale.y = top.distanceTo(bot) / coneH; scene.add(cone); }

// everything so far lives on the desk; the ending swaps it for the planet
const W1 = new THREE.Group(); for (const o of [...scene.children]) W1.add(o); scene.add(W1);

// ---------- the ending: the one wire, then the whole planet at night ----------
const R0 = 10, GL = new THREE.Group(); GL.visible = false; scene.add(GL);
// lat/lon to a point that matches SphereGeometry's uv layout (u = 0 at lon -180)
const ll = (lat, lon, r = R0) => { const ph = (lon + 180) * Math.PI / 180, th = (90 - lat) * Math.PI / 180;
  return new THREE.Vector3(-Math.cos(ph) * Math.sin(th) * r, Math.cos(th) * r, Math.sin(ph) * Math.sin(th) * r); };
const nightImg = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = 'img/earth-night.jpg'; });
const nightTex = new THREE.Texture(nightImg); nightTex.colorSpace = THREE.SRGBColorSpace; nightTex.anisotropy = 8; nightTex.needsUpdate = true;
const earthU = { tMap: { value: nightTex }, uLights: { value: 1 }, uBase: { value: .5 } };
const earth = new THREE.Mesh(new THREE.SphereGeometry(R0, 192, 128), new THREE.ShaderMaterial({ uniforms: earthU,
  vertexShader: 'varying vec2 vUv; varying vec3 vN, vV; void main(){ vUv = uv; vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
  fragmentShader: `uniform sampler2D tMap; uniform float uLights, uBase; varying vec2 vUv; varying vec3 vN, vV;
    void main(){ vec3 c = texture2D(tMap, vUv).rgb; float city = smoothstep(.05, .35, c.r - c.b * .55);
      vec3 col = c * uBase + vec3(1.0, .72, .4) * city * uLights * 2.6;
      col += vec3(.25, .45, 1.0) * pow(1.0 - max(dot(vN, vV), 0.0), 3.0) * .9;   // atmosphere at the limb
      gl_FragColor = vec4(col, 1.0); }` }));
GL.add(earth);
// light-weighted samples of where people are, for the ends of the links
const LIGHTS = (() => { const c = mk(1024, 512), g = c.getContext('2d'); g.drawImage(nightImg, 0, 0, 1024, 512); const d = g.getImageData(0, 0, 1024, 512).data, cum = [], pt = []; let sum = 0;
  for (let y = 0; y < 512; y++) for (let x = 0; x < 1024; x++) { const i = (y * 1024 + x) * 4, v = d[i] - d[i + 2] * .55; if (v > 18) { sum += v * v; cum.push(sum); pt.push([90 - (y + .5) / 512 * 180, (x + .5) / 1024 * 360 - 180]); } }
  return (u) => { let lo = 0, hi = cum.length - 1; const k = u * sum; while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < k) lo = m + 1; else hi = m; } return pt[lo]; }; })();
const LA = [34.07, -118.44], MP = [37.45, -122.18];
const arcPoint = (a, b, ang, u, lift) => a.clone().applyAxisAngle(new THREE.Vector3().crossVectors(a, b).normalize(), ang * u).multiplyScalar(R0 * (1 + lift * Math.sin(Math.PI * u)));
const ARCS = (() => {
  const r = rng(57), N = 1600, SEG = 40, la = ll(...LA, 1).normalize(), pos = [], aU = [], aT = [], aS = [], times = [];
  for (let n = 0; n < N; n++) {
    const p = LIGHTS(r()), q = LIGHTS(r()), A2 = ll(...p, 1).normalize(), B2 = ll(...q, 1).normalize(), ang = A2.angleTo(B2);
    if (ang < .1) { n--; continue; }
    const t0 = T.globe + .5 + 3.6 * Math.pow(A2.angleTo(la) / Math.PI, .8) + r() * .35, lift = .01 + .13 * ang / Math.PI, seed = r();

    drone: (w0, w1, dark) => bed(w0, w1, dark ? .045 : .05, (g) => [55, 55.35, 82.4].forEach((f) => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f * (dark ? .944 : 1); const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = dark ? 200 : 280; o.connect(lp).connect(g); o.start(w0); o.stop(w1 + .05); })),
    hum: (w0, w1) => bed(w0, w1, .02, (g) => [60, 120, 180].forEach((f, i) => { const o = ac.createOscillator(), og2 = ac.createGain(); o.frequency.value = f; og2.gain.value = [1, .5, .25][i]; o.connect(og2).connect(g); o.start(w0); o.stop(w1 + .05); })),
  };
}
const SPAN = new Set(['drone', 'hum', 'lamp', 'dread', 'scratch', 'swell']);
function schedule(ac, dest, from, at, bufs) { // film time `from` plays at audio time `at`
  const comp = ac.createDynamicsCompressor(), master = ac.createGain(); master.gain.value = .8; master.connect(comp).connect(dest);
  const S2 = synth(ac, master, bufs);
  for (const [k, t, a, b, c, d] of cueList()) {
    if (SPAN.has(k)) { if (a > from) S2[k](at + Math.max(0, t - from), at + (a - from), b); }
    else if (k === 'vo' || k === 'phone') { if (t + c > from) S2[k](at + Math.max(0, t - from), 0, a, b, c, Math.max(0, from - t)); }
    else if (t >= from) S2[k](at + t - from, a ?? 1, b);

}
window.renderSoundtrack = async () => {
  const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(T.dur * sr), sr);
  schedule(oc, oc.destination, 0, 0, await loadVO(oc));
  const b = await oc.startRendering(), n = b.length, L = b.getChannelData(0), Rr = b.getChannelData(1);
  const v = new DataView(new ArrayBuffer(44 + n * 4)), ws = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); ws(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { v.setInt16(44 + i * 4, cl(L[i], -1, 1) * 32767, true); v.setInt16(46 + i * 4, cl(Rr[i], -1, 1) * 32767, true); }
  let s = ''; const u = new Uint8Array(v.buffer); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000));
  return btoa(s);
};

// ---------- playback, scrub, sound ----------
let t0 = null, scrub = null, now = 0, ac = null, master = null, soundOn = false, bufs = null;
const filmT = () => scrub ?? (now - t0) / 1000;
function audioFrom(t) { if (master) { master.disconnect(); master = null; } if (soundOn && ac && bufs) master = schedule(ac, ac.destination, t, ac.currentTime + .03, bufs); }
const snd = document.getElementById('snd'), bar = document.getElementById('bar');
if (matchMedia('(pointer: coarse)').matches) document.getElementById('hint').textContent = 'drag to scrub';
snd.onclick = async (e) => { e.stopPropagation(); soundOn = !soundOn; if (soundOn && !ac) ac = new AudioContext(); ac?.resume();
  snd.textContent = 'sound: ' + (soundOn ? 'on' : 'off'); snd.setAttribute('aria-pressed', soundOn);
  if (soundOn && !bufs) { snd.textContent = 'sound: loading'; bufs = await loadVO(ac); snd.textContent = 'sound: on'; } audioFrom(filmT()); };
snd.onpointerdown = (e) => e.stopPropagation();
const scrubTo = (e) => { scrub = cl(e.clientX / innerWidth) * T.dur; };
cv.addEventListener('pointerdown', (e) => { if (PLAY) return; cv.setPointerCapture(e.pointerId); scrubTo(e); audioFrom(1e9); });
cv.addEventListener('pointermove', (e) => { if (scrub !== null) scrubTo(e); });
const release = () => { if (scrub === null) return; t0 = now - scrub * 1000; const s = scrub; scrub = null; audioFrom(s); };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); t0 = now; audioFrom(0); } if (e.key === 'm') snd.click(); });
function loop(ts) {
  requestAnimationFrame(loop);
  now = ts; if (t0 === null) t0 = ts;
  let t = FREEZE ?? filmT();
  if (!PLAY && FREEZE === null && scrub === null && t > T.dur + 1.5) { t0 = ts; t = 0; audioFrom(0); }
  t = Math.min(t, T.dur - 1e-3);
  frame(t);
  bar.style.transform = `scaleX(${t / T.dur})`;
}
window.__ready = true;
requestAnimationFrame(loop);
</script>
